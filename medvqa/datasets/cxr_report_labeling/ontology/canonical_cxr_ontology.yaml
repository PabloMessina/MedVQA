schema_version: 1.0.0
ontology:
  id: canonical_cxr_ontology
  name: "Canonical chest radiograph classifier ontology"
  version: 1.0.0
  status: review
  description: "Image-oriented multilabel ontology harmonizing the current canonical CXR classes with CXR-LT 2024, PUCCXR, and VinDr-CXR."
  source_of_truth: "This YAML document under medvqa/datasets/cxr_report_labeling/ontology/ is authoritative; generated representations must preserve its semantics."
  parent_semantics: "A parent edge is a true semantic is-a or label-inheritance relation, so a positive child propagates to every parent. Organizational membership is represented only by category."

categories:
  - {id: global, name: "Global", description: "Image-level states and globally distributed findings."}
  - {id: calcific_findings, name: "Calcific findings", description: "Organizational group for thoracic calcific findings modeled under the Calcification umbrella class."}
  - {id: pulmonary_opacity, name: "Pulmonary opacity", description: "Organizational group for pulmonary opacity patterns and related radiographic syndromes modeled under the Lung opacity umbrella class."}
  - {id: diagnostic_label, name: "Diagnostic label", description: "Explicit supervised diagnostic labels retained separately from image morphology."}
  - {id: focal_lesion_findings, name: "Focal lesion findings", description: "Organizational group for discrete intrapulmonary nodules/masses, cavities, and thin-walled cystic or bullous lucencies."}
  - {id: pulmonary_parenchyma, name: "Pulmonary parenchyma", description: "Pulmonary findings not appropriately organized as opacity or focal-lesion subtypes."}
  - {id: lung_volume, name: "Lung volume", description: "Findings describing reduced or increased lung volume."}
  - {id: pleura, name: "Pleura", description: "Pleural fluid, gas, thickening, plaque, calcification, and focal pleural lesions."}
  - {id: cardiomediastinal, name: "Cardiomediastinal", description: "Cardiac, vascular, hilar, and mediastinal contour or content findings."}
  - {id: airway, name: "Airway", description: "Tracheal and bronchial findings."}
  - {id: diaphragm, name: "Diaphragm", description: "Diaphragmatic contour, position, and hernia findings."}
  - {id: upper_abdomen, name: "Upper abdomen", description: "Clinically important upper-abdominal findings visible on CXR."}
  - {id: bone_fracture_findings, name: "Bone fracture findings", description: "Organizational group for fractures of osseous structures visible on chest radiographs, modeled under the Bone fracture umbrella class."}
  - {id: musculoskeletal, name: "Musculoskeletal", description: "Non-fracture thoracic osseous and spinal findings."}
  - {id: support_device, name: "Support device", description: "Therapeutic lines, tubes, implants, prostheses, surgical hardware, and device-associated attributes modeled under the Support device present umbrella."}
  - {id: soft_tissue, name: "Soft tissue", description: "Extra-osseous chest-wall and subcutaneous findings."}
  - {id: other, name: "Other", description: "Image-recognizable findings not fitting another anatomic category."}
  - {id: anatomic_variant, name: "Anatomic variant", description: "Visible benign anatomic variants."}

classes:
  - id: no_finding
    name: "No finding"
    category: global
    parents: []
    kind: state
    dataset_mappings: {puccxr: [], cxrlt2024: [{class_name: "Normal", relationship: near}], vindr_cxr: [{class_name: "No finding", relationship: exact}]}
    preliminary_definition: "Adequate chest radiograph with none of the modeled abnormal findings or support devices/hardware present."
    notes: ["Requires sufficient image quality and coverage.", "Mutually inconsistent with any positive modeled abnormality or device label."]
  - id: calcification
    name: "Calcification"
    category: calcific_findings
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Calcified granuloma", relationship: narrower}, {class_name: "Calcified heart valve", relationship: narrower}, {class_name: "Pleural plaques", relationship: narrower}], cxrlt2024: [{class_name: "Calcification of the Aorta", relationship: narrower}], vindr_cxr: [{class_name: "Calcification", relationship: exact}]}
    preliminary_definition: "Any radiopaque calcific density in the chest field of view, including nonspecific calcification and localized aortic, cardiac/valvular, pleural, pulmonary, nodal, or other soft-tissue calcification."
    notes: ["Umbrella classifier label.", "Positive specific calcification subtypes should propagate to this parent.", "May also be used when only a nonspecific or unlocalized calcification annotation is available."]
  - id: lung_opacity
    name: "Lung opacity"
    category: pulmonary_opacity
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Ground glass pattern", relationship: narrower}], cxrlt2024: [{class_name: "Lung Opacity", relationship: exact}, {class_name: "Infiltration", relationship: partial}], vindr_cxr: [{class_name: "Lung Opacity", relationship: exact}, {class_name: "Infiltration", relationship: partial}]}
    preliminary_definition: "Any increased pulmonary attenuation on CXR, including nonspecific opacity and more specific airspace, alveolar, interstitial, atelectatic, edematous, fibrotic, scar-like, or nodular patterns."
    notes: ["Umbrella classifier label present in multiple datasets.", "Positive specific opacity subtypes, pulmonary nodule or mass, and pneumonia should propagate to this parent.", "Absorbs nonspecific airspace, alveolar, interstitial, and infiltrate wording when no more specific child applies.", "May also be used when only a nonspecific opacity annotation is available."]
  - id: ground_glass_opacity_pattern
    name: "Ground-glass opacity/pattern"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Ground glass pattern", relationship: exact}], cxrlt2024: [{class_name: "Lung Opacity", relationship: broader}, {class_name: "Infiltration", relationship: partial}], vindr_cxr: [{class_name: "Lung Opacity", relationship: broader}, {class_name: "Infiltration", relationship: partial}]}
    preliminary_definition: "Hazy pulmonary opacity that preserves underlying bronchovascular margins as judged on CXR."
    notes: ["CXR sensitivity and distinction from subtle consolidation are limited.", "Require explicit report-supported pattern terminology."]
  - id: consolidation
    name: "Consolidation"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Consolidation", relationship: exact}], cxrlt2024: [{class_name: "Consolidation", relationship: exact}], vindr_cxr: [{class_name: "Consolidation", relationship: exact}]}
    preliminary_definition: "Dense airspace opacity that obscures underlying vessel margins and may contain air bronchograms."
    notes: ["Does not by itself establish pneumonia."]
  - id: pneumonia
    name: "Pneumonia"
    category: diagnostic_label
    parents: [lung_opacity]
    kind: diagnosis
    dataset_mappings: {puccxr: [{class_name: "Pneumonia", relationship: exact}], cxrlt2024: [{class_name: "Pneumonia", relationship: exact}], vindr_cxr: [{class_name: "Pneumonia", relationship: exact}]}
    preliminary_definition: "Explicit radiographic or report-level diagnosis of pneumonia supported by the CXR interpretation."
    notes: ["Nonexclusive diagnostic target.", "Positive pneumonia propagates to lung opacity via label inheritance.", "Lung opacity, consolidation, infiltrate, and other opacity morphology do not propagate to pneumonia."]
  - id: tuberculosis
    name: "Tuberculosis"
    category: diagnostic_label
    parents: []
    kind: diagnosis
    dataset_mappings: {puccxr: [], cxrlt2024: [{class_name: "Tuberculosis", relationship: near}], vindr_cxr: [{class_name: "Tuberculosis", relationship: near}]}
    preliminary_definition: "Thoracic tuberculosis on CXR: explicit active or suspected TB involving lung, pleura, nodes, or other thoracic structures, or currently visible radiographic sequelae explicitly attributed to prior TB."
    notes: ["Includes pulmonary, pleural, empyema, nodal, and miliary manifestations when TB-attributed.", "Includes visible healed or inactive TB sequelae when currently shown and TB-attributed.", "History, latent TB, or exposure alone is insufficient.", "Do not derive from cavity, fibrosis, scarring, granuloma, adenopathy, or pleural findings without an explicit TB link."]
  - id: interstitial_lung_disease
    name: "Interstitial lung disease"
    category: diagnostic_label
    parents: []
    kind: diagnosis
    dataset_mappings: {puccxr: [{class_name: "Reticular interstitial pattern", relationship: partial}, {class_name: "Pulmonary fibrosis", relationship: narrower}], cxrlt2024: [{class_name: "Fibrosis", relationship: narrower}], vindr_cxr: [{class_name: "ILD", relationship: exact}]}
    preliminary_definition: "Explicit report-level diagnosis or diagnostic impression of interstitial lung disease on CXR."
    notes: ["Nonexclusive diagnostic target.", "Do not infer from interstitial or reticular opacity, reticulation, fibrosis, or scarring alone."]
  - id: atelectasis
    name: "Atelectasis"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Atelectasis", relationship: exact}], cxrlt2024: [{class_name: "Atelectasis", relationship: exact}], vindr_cxr: [{class_name: "Atelectasis", relationship: exact}]}
    preliminary_definition: "Pulmonary volume loss with associated increased opacity or displacement of fissures, vessels, hilum, or mediastinum."
    notes: ["Supports both unlocalized labels and named subtypes."]
  - id: lobar_atelectasis
    name: "Lobar atelectasis"
    category: pulmonary_opacity
    parents: [atelectasis]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Atelectasis", relationship: broader}], cxrlt2024: [{class_name: "Lobar Atelectasis", relationship: exact}], vindr_cxr: [{class_name: "Atelectasis", relationship: broader}]}
    preliminary_definition: "Atelectasis localized to a pulmonary lobe with compatible lobar volume-loss signs."
    notes: ["Use only when lobar localization is explicit and reliable."]
  - id: rounded_atelectasis
    name: "Rounded atelectasis"
    category: pulmonary_opacity
    parents: [atelectasis]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Atelectasis", relationship: broader}], cxrlt2024: [{class_name: "Round(ed) Atelectasis", relationship: exact}], vindr_cxr: [{class_name: "Atelectasis", relationship: broader}]}
    preliminary_definition: "Rounded peripheral atelectatic opacity with pleural association and characteristic converging bronchovascular markings when visible."
    notes: ["May mimic a pulmonary mass.", "Confident distinction can require CT."]
  - id: reticular_interstitial_opacity_pattern
    name: "Reticular interstitial opacity/pattern"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Reticular interstitial pattern", relationship: exact}], cxrlt2024: [{class_name: "Fibrosis", relationship: partial}, {class_name: "Infiltration", relationship: partial}], vindr_cxr: [{class_name: "ILD", relationship: partial}, {class_name: "Pulmonary fibrosis", relationship: partial}]}
    preliminary_definition: "Network-like pulmonary linear opacities forming a reticular pattern on CXR."
    notes: ["Does not establish a specific interstitial disease or fibrosis."]
  - id: kerley_lines
    name: "Kerley lines"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Kerley lines", relationship: exact}], cxrlt2024: [{class_name: "Edema", relationship: partial}], vindr_cxr: [{class_name: "Edema", relationship: partial}]}
    preliminary_definition: "Visible linear opacities produced by thickened pulmonary interlobular septa, including Kerley A, B, and C lines and equivalent septal-line descriptions on CXR."
    notes: ["May coexist with edema or vascular congestion but does not by itself establish edema, congestion, or a specific cause.", "Does entail visible septal-line morphology when positive.", "Exclude bare ultrasound B-lines without clear CXR or Kerley context."]
  - id: pulmonary_edema
    name: "Pulmonary edema"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Edema", relationship: near}, {class_name: "Kerley lines", relationship: narrower}], cxrlt2024: [{class_name: "Edema", relationship: near}], vindr_cxr: [{class_name: "Edema", relationship: near}]}
    preliminary_definition: "Interstitial or alveolar pulmonary fluid accumulation visible on CXR and interpreted as pulmonary edema."
    notes: ["Radiographic finding; etiology need not be specified.", "May coexist with but is not equivalent to vascular congestion.", "Does not include peripheral or soft-tissue edema."]
  - id: fibrotic_lung_change
    name: "Fibrotic lung change"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pulmonary fibrosis", relationship: near}], cxrlt2024: [{class_name: "Fibrosis", relationship: near}], vindr_cxr: [{class_name: "Pulmonary fibrosis", relationship: near}, {class_name: "ILD", relationship: partial}]}
    preliminary_definition: "Chronic fibrotic parenchymal remodeling with coarse reticulation, architectural distortion, volume loss, honeycombing, or traction bronchiectasis, beyond isolated focal scarring."
    notes: ["Does not assert a specific cause.", "Not all interstitial lung disease is fibrotic.", "Distinct from focal pulmonary scarring; isolated apical or limited scars do not establish this class."]
  - id: focal_pulmonary_scarring
    name: "Focal pulmonary scarring"
    category: pulmonary_opacity
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pulmonary fibrosis", relationship: broader}], cxrlt2024: [{class_name: "Fibrosis", relationship: broader}], vindr_cxr: [{class_name: "Pulmonary fibrosis", relationship: broader}]}
    preliminary_definition: "Focal or limited chronic linear, apical, or pleuroparenchymal opacity with scar-like distortion."
    notes: ["Includes apical scarring and other limited postinfectious or post-inflammatory scars.", "Does not by itself establish fibrotic lung change.", "Distinguish from diffuse fibrotic lung change when annotation permits."]
  - id: pulmonary_nodule_or_mass
    name: "Pulmonary nodule or mass"
    category: focal_lesion_findings
    parents: [lung_opacity]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Nodule", relationship: exact}, {class_name: "Lung Mass", relationship: exact}, {class_name: "Granuloma", relationship: partial}], cxrlt2024: [{class_name: "Nodule", relationship: exact}, {class_name: "Mass", relationship: exact}, {class_name: "Lung Lesion", relationship: near}], vindr_cxr: [{class_name: "Nodule/Mass", relationship: exact}, {class_name: "Lung tumor", relationship: partial}]}
    preliminary_definition: "Discrete intrapulmonary nodular or mass-like opacity of any size, without requiring a nodule-versus-mass size cutoff."
    notes: ["Nodule and mass are merged because CXR size boundaries are often unreliable.", "Does not imply malignancy.", "Positive labels propagate to lung opacity.", "Calcified nodules and granulomas also support this class and may additionally support the calcified nodule/granuloma class."]
  - id: calcified_pulmonary_nodule_or_granuloma
    name: "Calcified pulmonary nodule or granuloma"
    category: focal_lesion_findings
    parents: [calcification, pulmonary_nodule_or_mass]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Calcified granuloma", relationship: near}, {class_name: "Granuloma", relationship: partial}], cxrlt2024: [{class_name: "Granuloma", relationship: near}], vindr_cxr: [{class_name: "Calcification", relationship: broader}]}
    preliminary_definition: "Intrapulmonary nodule or granuloma with convincing calcification, or an explicitly calcified pulmonary granulomatous focus."
    notes: ["Requires pulmonary localization and calcification or calcified-granuloma wording.", "Positive labels propagate to calcification, pulmonary nodule or mass, and lung opacity.", "Noncalcified granulomas belong under pulmonary nodule or mass only."]
  - id: pulmonary_cavity
    name: "Pulmonary cavity"
    category: focal_lesion_findings
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Cavitation", relationship: near}], cxrlt2024: [{class_name: "Tuberculosis", relationship: partial}], vindr_cxr: [{class_name: "Lung cavity", relationship: exact}, {class_name: "Tuberculosis", relationship: partial}]}
    preliminary_definition: "Gas-containing lucency within a pulmonary opacity, mass, or nodule with a discernible wall."
    notes: ["Separate from thin-walled cyst and bulla.", "Does not establish tuberculosis or another cause."]
  - id: pulmonary_cyst_or_bulla
    name: "Pulmonary cyst or bulla"
    category: focal_lesion_findings
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Bulla", relationship: exact}], cxrlt2024: [{class_name: "Bulla", relationship: exact}], vindr_cxr: [{class_name: "Lung cyst", relationship: near}, {class_name: "Emphysema", relationship: partial}]}
    preliminary_definition: "Discrete thin-walled intrapulmonary lucency described as a cyst, bulla, or bleb, without requiring a cyst-versus-bulla distinction."
    notes: ["Cyst versus bulla is often unreliable on CXR and better established by CT.", "Separate from thick-walled cavity and from honeycombing as a fibrotic pattern."]
  - id: emphysema
    name: "Emphysema"
    category: pulmonary_parenchyma
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [], cxrlt2024: [{class_name: "Emphysema", relationship: exact}], vindr_cxr: [{class_name: "Emphysema", relationship: exact}, {class_name: "COPD", relationship: partial}]}
    preliminary_definition: "Hyperlucent lungs with vascular attenuation or bullous change compatible with emphysematous destruction."
    notes: ["Does not by itself establish clinical COPD."]
  - id: bronchiectasis
    name: "Bronchiectasis"
    category: airway
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Bronchiectasis", relationship: exact}], cxrlt2024: [], vindr_cxr: []}
    preliminary_definition: "Radiographic bronchial dilatation suggested by tram-track lines, ring shadows of dilated bronchi, or report-supported airway enlargement, including traction bronchiectasis and, by ontology convention, bronchiolectasis."
    notes: ["CXR sensitivity is limited.", "Exclude CT-only historical diagnoses without radiographic attribution.", "By convention includes bronchiolectasis when CXR-attributed.", "Bare ring shadows without bronchial or bronchiectatic attribution are insufficient.", "No lung_opacity parent: increased parenchymal density is not an unavoidable component of bronchial dilatation."]
  - id: bronchial_wall_thickening
    name: "Bronchial wall thickening"
    category: airway
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [], cxrlt2024: [], vindr_cxr: []}
    preliminary_definition: "Visible thickening of the bronchial walls or peribronchial tissues producing bronchial or peribronchial cuffing."
    notes: ["Subjective finding that should be distinguished from bronchiectasis and nonspecific interstitial or bronchovascular prominence.", "Peribronchial cuffing is treated as supportive CXR morphology for this class.", "No lung_opacity parent: primarily an airway-wall/peribronchial finding."]
  - id: low_lung_volume
    name: "Low lung volume"
    category: lung_volume
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [], cxrlt2024: [], vindr_cxr: []}
    preliminary_definition: "Reduced overall inspiratory lung expansion on the available projection, whether from technique, effort, or physiology, reflected by report-supported low volumes, hypoinflation, or poor inspiration."
    notes: ["Technical inspiration and physiology may both contribute.", "Important confounder for opacity and atelectasis.", "Do not equate with focal/lobar/unilateral volume loss or isolated elevated/eventrated hemidiaphragm.", "Low rib count or elevated diaphragms support only when the report links them to reduced inspiration or low volumes."]
  - id: hyperinflation
    name: "Hyperinflation"
    category: lung_volume
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Hyperinflated lung", relationship: near}, {class_name: "Flattened diaphragm", relationship: partial}], cxrlt2024: [{class_name: "Emphysema", relationship: partial}], vindr_cxr: [{class_name: "COPD", relationship: partial}, {class_name: "Emphysema", relationship: partial}]}
    preliminary_definition: "Increased overall lung volume with excessive expansion on the available projection, including report-supported hyperinflation, hyperexpansion, overdistention, or hyperaeration."
    notes: ["Does not establish COPD or emphysema.", "Assess in light of projection and inspiration.", "Global/generalized class: focal or unilateral overinflation alone is insufficient.", "Flattened or low diaphragms support only when the report links them to increased lung volumes; bare flattening belongs with flattened_diaphragm."]
  - id: pleural_effusion
    name: "Pleural effusion"
    category: pleura
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pleural effusion", relationship: exact}], cxrlt2024: [{class_name: "Pleural Effusion", relationship: exact}], vindr_cxr: [{class_name: "Pleural effusion", relationship: exact}]}
    preliminary_definition: "Fluid in the pleural space producing meniscus, dependent opacity, or other compatible pleural-fluid morphology."
    notes: ["Supports unlocalized fluid and localized subtypes."]
  - id: loculated_or_fissural_pleural_effusion
    name: "Loculated/fissural effusion"
    category: pleura
    parents: [pleural_effusion]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pleural effusion", relationship: broader}], cxrlt2024: [{class_name: "Fissure", relationship: partial}, {class_name: "Pleural Effusion", relationship: broader}], vindr_cxr: [{class_name: "Pleural effusion", relationship: broader}]}
    preliminary_definition: "Non-free pleural fluid confined by adhesions or collecting within an interlobar fissure."
    notes: ["Frontal-only imaging may mimic pleural mass or thickening.", "The source label Fissure is too ambiguous for direct equivalence."]
  - id: costophrenic_angle_blunting
    name: "Costophrenic angle blunting"
    category: pleura
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Costophrenic angle blunting", relationship: exact}], cxrlt2024: [{class_name: "Pleural Effusion", relationship: partial}, {class_name: "Pleural Other", relationship: partial}], vindr_cxr: [{class_name: "Pleural effusion", relationship: partial}]}
    preliminary_definition: "Loss of the normally sharp costophrenic angle, sulcus, or recess on an appropriate projection."
    notes: ["Pleural fluid is common but scarring and other causes are possible.", "Does not inherit from pleural effusion; require explicit costophrenic contour wording.", "Exclude cardiophrenic-angle findings and technical nonvisualization."]
  - id: pneumothorax
    name: "Pneumothorax"
    category: pleura
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pneumothorax", relationship: exact}], cxrlt2024: [{class_name: "Pneumothorax", relationship: exact}], vindr_cxr: [{class_name: "Pneumothorax", relationship: exact}]}
    preliminary_definition: "Pleural gas with a visible visceral pleural line and absent peripheral lung markings or equivalent compatible signs."
    notes: ["Supine projection can substantially alter appearance."]
  - id: hydropneumothorax
    name: "Hydropneumothorax"
    category: pleura
    parents: [pleural_effusion, pneumothorax]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pleural effusion", relationship: partial}, {class_name: "Pneumothorax", relationship: partial}], cxrlt2024: [{class_name: "Hydropneumothorax", relationship: exact}], vindr_cxr: [{class_name: "Pleural effusion", relationship: partial}, {class_name: "Pneumothorax", relationship: partial}]}
    preliminary_definition: "Concurrent pleural gas and fluid, often producing a straight air-fluid level."
    notes: ["Multiple inheritance intentionally propagates both pleural effusion and pneumothorax."]
  - id: pleural_thickening
    name: "Pleural thickening"
    category: pleura
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pleural thickening", relationship: exact}], cxrlt2024: [{class_name: "Pleural Thickening", relationship: exact}], vindr_cxr: [{class_name: "Pleural thickening", relationship: exact}]}
    preliminary_definition: "Focal or diffuse increased pleural density or width consistent with pleural thickening."
    notes: ["Pleural plaque and pleural calcification are distinct subtypes that propagate to this parent; they are not synonyms of each other or of nonspecific thickening."]
  - id: pleural_plaque
    name: "Pleural plaque"
    category: pleura
    parents: [pleural_thickening]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pleural plaques", relationship: exact}], cxrlt2024: [{class_name: "Pleural Other", relationship: broader}], vindr_cxr: [{class_name: "Pleural thickening", relationship: partial}, {class_name: "Calcification", relationship: broader}]}
    preliminary_definition: "Discrete focal pleural thickening with plaque or plaque-like morphology, whether calcified or noncalcified."
    notes: ["Do not require calcification.", "Positive plaque labels propagate to pleural thickening.", "Pleural calcification is labeled separately only when calcification is explicit.", "Generic thickening, scarring, or asbestos exposure without plaque/plaque-like wording is insufficient."]
  - id: pleural_calcification
    name: "Pleural calcification"
    category: pleura
    parents: [pleural_thickening, calcification]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pleural plaques", relationship: partial}], cxrlt2024: [{class_name: "Pleural Other", relationship: broader}], vindr_cxr: [{class_name: "Calcification", relationship: broader}]}
    preliminary_definition: "Calcific density localized to the pleura."
    notes: ["May coexist with pleural plaque but is not equivalent.", "Positive labels propagate to pleural thickening and calcification."]
  - id: pleural_nodule_or_mass
    name: "Pleural nodule or mass"
    category: pleura
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Pleural mass", relationship: near}], cxrlt2024: [{class_name: "Pleural Other", relationship: broader}, {class_name: "Mass", relationship: partial}], vindr_cxr: [{class_name: "Other lesion", relationship: broader}]}
    preliminary_definition: "Focal pleural-based soft-tissue opacity described as a nodule or mass."
    notes: ["Keep separate from pulmonary lesions and diffuse pleural thickening.", "Do not split by size until localization is reliable."]
  - id: enlarged_cardiomediastinal_silhouette
    name: "Enlarged cardiomediastinal silhouette"
    category: cardiomediastinal
    parents: []
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Cardiomegaly", relationship: narrower}, {class_name: "Mediastinal enlargement", relationship: narrower}], cxrlt2024: [{class_name: "Enlarged Cardiomediastinum", relationship: exact}], vindr_cxr: [{class_name: "Cardiomegaly", relationship: narrower}, {class_name: "Aortic enlargement", relationship: narrower}]}
    preliminary_definition: "Enlargement or widening of the cardiac, mediastinal, or combined cardiomediastinal silhouette on CXR."
    notes: ["Umbrella classifier label.", "Positive cardiac, mediastinal-widening, and aortic-enlargement subtypes should propagate to this parent.", "May also be used when only nonspecific enlarged cardiomediastinum wording is available."]
  - id: enlarged_cardiac_silhouette
    name: "Enlarged cardiac silhouette"
    category: cardiomediastinal
    parents: [enlarged_cardiomediastinal_silhouette]
    kind: finding
    dataset_mappings: {puccxr: [{class_name: "Cardiomegaly", relationship: near}], cxrlt2024: [{class_name: "Cardiomegaly", relationship: near}, {class_name: "Enlarged Cardiomediastinum", relationship: broader}], vindr_cxr: [{class_name: "Cardiomegaly", relationship: near}]}
    preliminary_definition: "Cardiac silhouette larger than expected for projection and thoracic size."
